[mod]
id = "smooth_f5"
version = "1.0.0"
priority = 100

# The commit it was built and tested on.
[compatibility]
horizon_revision = "d8edfbcd0f70aac5b41bab12b8bbf9cc3626de1f"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "smooth_f5"
source = "runtime.rs"

[[injection]]
id = "camera"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_camera_shake"
helper = "camera.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "view", ty = "&horizon_client_render::camera::Camera", value = "&self.view" },
  { name = "detached", ty = "bool", value = "!self.camera_type.is_first_person()" },
  { name = "mirrored", ty = "bool", value = "self.camera_type.is_mirrored()" },
  { name = "fall_flying", ty = "bool", value = "self.player.as_ref().is_some_and(|p| p.fall_flying)" },
  { name = "shake", ty = "&mut crate::game::native_hooks::NativeShake", value = "&mut *shake" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]
